})();

@import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&display=swap');
.ww{--desk:#DFE6F0;--paper:#FFFFFF;--ink:#1F3FA3;--ink-2:#4A5FB0;--ink-wash:#EEF2FB;--graphite:#2A2E35;--muted:#667080;--line:#C9D5EA;--line-2:#E4EAF4;--red:#D23B2F;--marker:255,222,64;--masc:#1F5FD1;--fem:#C8372D;--neut:#2E7D4E;--plural:#7654A8;
--sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
--din:"DIN Alternate","DIN Next LT Pro","DIN 1451","Barlow Semi Condensed","Roboto Condensed","Arial Narrow",sans-serif;
--din-c:"DIN Condensed","Barlow Semi Condensed","Roboto Condensed","Arial Narrow",sans-serif;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",Georgia,serif;
min-height:100vh;background:var(--desk);color:var(--graphite);font-family:var(--sans);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.ww *{box-sizing:border-box}
.ww button,.ww select,.ww input{font-family:inherit}
.ww button{cursor:pointer}
.ww :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.ww-header{position:sticky;top:0;z-index:20;background:var(--desk)}
.ww-header-in{max-width:28rem;margin:0 auto;padding:14px 18px 0}
.ww-header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ww-logo{margin:0;font-family:var(--din-c);font-weight:700;font-size:30px;line-height:1;color:var(--ink);letter-spacing:.005em}
.ww-header-r{display:flex;align-items:center;gap:8px}
.ww-count{margin:0;font-size:13px;color:var(--muted)}
.ww-count b{font-family:var(--din);font-weight:700;font-size:17px;color:var(--ink)}
.ww-gear{display:inline-flex;border:0;background:transparent;color:var(--ink);padding:8px;margin:-8px -8px -8px 0;border-radius:10px}
.ww-progress{height:3px;margin-top:10px;background:var(--line);border-radius:2px;overflow:hidden}
.ww-progress span{display:block;height:100%;background:var(--ink);transition:width .5s ease}

.ww-main{max-width:28rem;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
.ww-learn,.ww-quiz{padding-bottom:78px}
.ww-loading{margin:0;padding:40px 4px;color:var(--muted);font-size:14px}

.ww-toolbar{display:flex;gap:8px;align-items:stretch}
.ww-seg{flex:1;display:flex;gap:2px;padding:3px;background:#fff;border:1px solid var(--line);border-radius:11px}
.ww-seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:9px 4px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.ww-seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.ww-seg-mt{margin-top:10px}
.ww-iconbtn{flex:none;width:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:11px}
.ww-iconbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.ww-chips{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ww-chips::-webkit-scrollbar{display:none}
.ww-chips.ww-chips-wrap{flex-wrap:wrap;overflow:visible;margin:10px 0 0;padding:0}
.ww-chip{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.55);color:var(--graphite);border-radius:999px;padding:7px 13px;font-size:13.5px;white-space:nowrap}
.ww-chip[aria-pressed="true"]{background:#fff;border-color:var(--ink);color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1px var(--ink)}
.ww-chip-sep{flex:none;width:1px;align-self:stretch;background:var(--line);margin:4px 2px}
.ww-counter{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 0;font-size:13px;color:var(--muted)}
.ww-counter b{font-family:var(--din);font-size:16px;color:var(--ink)}
.ww-navs{display:flex;align-items:center;gap:2px}
.ww-nav{display:inline-flex;border:0;background:transparent;color:var(--ink);padding:6px;border-radius:8px}
.ww-nav:disabled{color:var(--line);cursor:default}
.ww-autobtn{display:inline-flex;align-items:center;gap:4px;margin-right:4px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:5px 10px 5px 8px;font-size:12.5px;font-weight:600}
.ww-autobtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.ww-textbtn{border:0;background:transparent;color:var(--ink);font-size:13.5px;font-weight:600;padding:6px 4px}

.ww-stack{position:relative;margin-top:8px}
.ww-ghost{position:absolute;inset:0;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(25,45,100,.12)}
.ww-ghost-1{transform:translateY(7px) scaleX(.975);opacity:.9}
.ww-ghost-2{transform:translateY(14px) scaleX(.95);opacity:.7}
.ww-card{position:relative;z-index:1;background:var(--paper);border-radius:8px;padding:18px 18px 22px;box-shadow:0 1px 0 rgba(25,45,100,.05),0 12px 28px -14px rgba(25,45,100,.42)}
.ww-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:-18px -18px 18px;padding:13px 18px 10px;border-bottom:1.5px solid var(--red);font-size:12.5px;color:var(--muted)}
.ww-lv{font-family:var(--din);font-weight:700;font-size:12.5px;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:1px 6px 0}
.ww-st{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-weight:700}
.ww-st.known{color:var(--ink)}
.ww-st.again{color:var(--red)}
.ww-head{margin:0;font-family:var(--din);font-weight:700;color:var(--ink);line-height:1.08;letter-spacing:-.005em;overflow-wrap:anywhere;hyphens:auto}
.ww-art{font-size:.52em;letter-spacing:.01em}
.ww-art.der{color:var(--masc)}.ww-art.die{color:var(--fem)}.ww-art.das{color:var(--neut)}.ww-art.pl{color:var(--plural)}
.ww-ipa{margin:8px 0 0;font-size:15px;color:var(--muted);letter-spacing:.01em}
.ww-spk-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ww-spk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 14px 8px 11px;font-size:13.5px;font-weight:600;line-height:1.2}
.ww-spk:active{background:var(--ink-wash)}
.ww-spk-c{border:0;padding:7px;background:transparent;border-radius:8px}
.ww-reveal{display:block;width:100%;margin-top:20px;padding:15px;border:1.5px dashed var(--line);border-radius:10px;background:transparent;color:var(--ink);font-size:15.5px;font-weight:700}
.ww-reveal:active{background:var(--ink-wash)}
.ww-details{margin-top:20px;animation:ww-in .3s ease-out both}
.ww-meaning{margin:0;font-size:22px;font-weight:700;line-height:1.4;color:var(--graphite);word-break:keep-all}
.ww-forms{margin:6px 0 0;font-size:13.5px;color:var(--muted);line-height:1.5}
.ww-note{margin:10px 0 0;padding:2px 0 2px 10px;border-left:3px solid rgb(var(--marker));font-size:14px;line-height:1.55;color:var(--graphite);word-break:keep-all}
.ww-rule{height:1px;background:var(--line);margin:18px -18px}
.ww-sentence{margin:0;font-family:var(--serif);font-size:19.5px;line-height:1.7;color:var(--ink)}
.ww-target{font-weight:700}
.ww-tr{margin:12px 0 0;font-size:15.5px;line-height:1.65;color:var(--graphite);word-break:keep-all}
.ww-label{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--muted)}
.ww-hardlist{list-style:none;margin:0 -8px;padding:0}
.ww-hardlist li{padding:9px 8px;border-radius:8px;transition:background-color .25s}
.ww-hardlist li+li{border-top:1px dashed var(--line-2)}
.ww-hardlist li.is-active{background:rgba(var(--marker),.2)}
.ww-hard-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ww-hard-w{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--ink)}
.ww-hard-b{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.ww-hard-b span{color:var(--ink-2)}
.ww-hard-m{margin:3px 0 0;font-size:15px;line-height:1.5;color:var(--graphite);word-break:keep-all}

.ww-hl{background-image:linear-gradient(104deg,rgba(var(--marker),0) .9%,rgba(var(--marker),.95) 2.4%,rgba(var(--marker),.75) 6%,rgba(var(--marker),.62) 92%,rgba(var(--marker),.9) 96%,rgba(var(--marker),0) 98.5%);background-repeat:no-repeat;background-size:100% 64%;background-position:0 82%;border-radius:.2em .5em .25em .55em;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .14em;margin:0 -.06em}
.ww-sweep{animation:ww-sweep .6s cubic-bezier(.3,.7,.2,1) both}
.ww-mark{cursor:pointer}
.ww-mark.is-active{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--ink)}
@keyframes ww-sweep{from{background-size:0% 64%}to{background-size:100% 64%}}
@keyframes ww-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ww-up{from{transform:translateY(48px);opacity:.5}to{transform:none;opacity:1}}
@keyframes ww-fade{from{opacity:0}to{opacity:1}}
@keyframes ww-rot{to{transform:rotate(360deg)}}

.ww-actions{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:15;pointer-events:none}
.ww-actions-in{max-width:28rem;margin:0 auto;padding:14px 16px 10px;display:flex;gap:10px;background:linear-gradient(to top,var(--desk) 62%,rgba(223,230,240,0));pointer-events:auto}
.ww-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:14px 12px;font-size:15.5px;font-weight:700;border:1.5px solid var(--ink);line-height:1.2}
.ww-btn-1{background:var(--ink);color:#fff}
.ww-btn-1:active{background:#18338A}
.ww-btn-2{background:#fff;color:var(--ink)}
.ww-btn-2:active{background:var(--ink-wash)}
.ww-btn:disabled{opacity:.45;cursor:default}
.ww-btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.ww-block{display:flex;width:100%;margin-top:18px}
.ww-duo{display:flex;gap:10px;margin-top:14px}

.ww-empty{margin-top:18px;background:#fff;border-radius:8px;padding:20px 18px}
.ww-empty h2{margin:0;font-size:18px;font-weight:700;color:var(--graphite);line-height:1.4;word-break:keep-all}
.ww-empty p{margin:6px 0 16px;font-size:14.5px;line-height:1.6;color:var(--muted);word-break:keep-all}
.ww-empty .ww-btn{width:100%}

.ww-qbar{height:3px;margin:8px 2px 0;background:var(--line);border-radius:2px;overflow:hidden}
.ww-qbar span{display:block;height:100%;background:var(--ink-2);transition:width .35s ease}
.ww-qcard{margin-top:12px}
.ww-blank{display:inline-block;min-width:4.6em;height:1.05em;border-bottom:2px solid var(--ink);vertical-align:-.12em;margin:0 .1em}
.ww-opts{display:grid;gap:8px;margin-top:14px}
.ww-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.4;color:var(--graphite);word-break:keep-all}
.ww-opt[lang="de"]{font-family:var(--serif);font-size:18px;color:var(--ink)}
.ww-opt:not(:disabled):active{background:var(--ink-wash)}
.ww-opt:disabled{cursor:default}
.ww-opt.is-right{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ww-opt.is-right .ww-opt-i{color:var(--ink)}
.ww-opt.is-wrong{border-color:var(--red);color:var(--red)}
.ww-opt.is-wrong .ww-opt-t{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.ww-opt.is-wrong .ww-opt-i{color:var(--red)}
.ww-opt.is-dim{opacity:.5}
.ww-opt-i{flex:none}
.ww-fb{margin-top:14px;background:#fff;border-radius:10px;padding:14px 16px;animation:ww-in .25s ease-out both}
.ww-fb-h{margin:0;font-weight:700;font-size:15px}
.ww-fb-h.ok{color:var(--ink)}.ww-fb-h.no{color:var(--red)}
.ww-fb-de{margin:8px 0 0;font-family:var(--serif);font-size:17px;line-height:1.6;color:var(--ink)}
.ww-fb-ko{margin:4px 0 0;font-size:14.5px;line-height:1.6;color:var(--graphite);word-break:keep-all}
.ww-result-h{margin:0;font-family:var(--din);font-weight:700;font-size:28px;line-height:1.25;color:var(--ink);word-break:keep-all}
.ww-help{margin:8px 0 0;font-size:13.5px;line-height:1.6;color:var(--muted);word-break:keep-all}
.ww-miss{list-style:none;margin:16px -18px -22px;padding:0;border-top:1px solid var(--line)}
.ww-miss li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 10px 18px;border-bottom:1px solid var(--line-2)}
.ww-miss li:last-child{border-bottom:0}

.ww-panel{margin-top:22px;background:#fff;border-radius:10px;padding:16px 16px 18px}
.ww-panel-top{margin-top:4px}
.ww-panel h3{margin:0;font-size:15.5px;font-weight:700;color:var(--graphite)}
.ww-panel .ww-help+h3{margin-top:20px}
.ww-panel-p{margin:4px 0 0;font-size:13.5px;line-height:1.6;color:var(--muted);word-break:keep-all}
.ww-input{display:block;width:100%;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;color:var(--graphite);background:#fff}
.ww-input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ww-msg{margin:10px 0 0;font-size:13.5px;line-height:1.55;word-break:keep-all}
.ww-msg.ok{color:var(--ink)}.ww-msg.err{color:var(--red)}
.ww-spin{animation:ww-rot 1s linear infinite}

.ww-search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 12px;color:var(--muted)}
.ww-search:focus-within{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ww-search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px;padding:9px 0;color:var(--graphite)}
.ww-search input::-webkit-search-cancel-button{display:none}
.ww-group{margin-top:20px}
.ww-group-h{margin:0;width:100%;border:0;background:transparent;display:flex;align-items:center;justify-content:space-between;padding:8px 4px 8px;font-size:14px;font-weight:700;color:var(--graphite);text-align:left;cursor:pointer}
.ww-group-n{font-family:var(--din);color:var(--muted);font-size:14px}
.ww-rows{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 0 rgba(25,45,100,.05)}
.ww-row{display:flex;align-items:center;gap:6px;padding:10px 4px 10px 14px;border-bottom:1px solid var(--line-2);cursor:pointer}
.ww-row:last-child{border-bottom:0}
.ww-row:active{background:var(--ink-wash)}
.ww-row-main{flex:1;min-width:0}
.ww-row-w{margin:0;font-family:var(--din);font-weight:700;font-size:17.5px;line-height:1.25;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ww-row-m{margin:2px 0 0;font-size:13.5px;color:var(--graphite);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ww-row-lv{flex:none;width:24px;text-align:center;font-family:var(--din);font-weight:700;font-size:12px;color:var(--muted)}
.ww-row-st{flex:none;width:18px;display:inline-flex;justify-content:center}

.ww-tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.ww-tabs-in{max-width:28rem;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.ww-tab{height:60px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:12px;font-weight:600}
.ww-tab[aria-current="page"]{color:var(--ink);font-weight:700}

.ww-toast{position:fixed;left:16px;right:16px;bottom:calc(142px + env(safe-area-inset-bottom));z-index:60;max-width:26rem;margin:0 auto;background:var(--graphite);color:#fff;font-size:14px;line-height:1.55;padding:12px 14px;border-radius:10px;box-shadow:0 10px 30px -10px rgba(0,0,0,.45);animation:ww-in .22s ease-out both;word-break:keep-all}

.ww-sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(20,32,70,.4);display:flex;align-items:flex-end;justify-content:center;animation:ww-fade .2s ease-out both}
.ww-sheet{position:relative;width:100%;max-width:28rem;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);border-radius:16px 16px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));animation:ww-up .28s cubic-bezier(.2,.8,.2,1) both}
.ww-grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 6px}
.ww-sheet-close{position:absolute;top:8px;right:8px;z-index:2;display:inline-flex;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:8px}
.ww-sheet .ww-meta{margin:6px -18px 18px;padding-right:52px}
.ww-sheet-actions{display:flex;gap:10px;margin-top:22px}
.ww-del{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:12px;padding:12px;border:0;background:transparent;color:var(--red);font-size:14px;font-weight:600}
.ww-sheet-title{margin:8px 0 0;font-size:17px;font-weight:700;color:var(--graphite)}
.ww-set-h{margin:18px 0 0;font-size:13.5px;font-weight:700;color:var(--muted)}
.ww-select{appearance:auto;-webkit-appearance:menulist;margin-top:8px}

.ww-today{padding-bottom:78px}
.ww-spk-big{padding:12px 20px 12px 15px;font-size:16px;border:1.5px solid var(--ink)}
.ww-listen{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0 2px}
.ww-listen-ans{margin-top:18px;animation:ww-in .25s ease-out both}
.ww-plan{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:12px}
.ww-plan-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ww-plan-t{font-size:13.5px;font-weight:700;color:var(--graphite)}
.ww-plan-streak{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--red)}
.ww-steps{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ww-steps li{display:flex;align-items:center;gap:8px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--muted);font-weight:600;word-break:keep-all}
.ww-steps li span{flex:none;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--din);font-size:12px;font-weight:700;background:var(--line-2);color:var(--muted)}
.ww-steps li.is-on{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ww-steps li.is-on span{background:var(--ink);color:#fff}
.ww-steps li.is-ok span{background:rgb(var(--marker));color:var(--graphite)}
.ww-warn{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--red);font-weight:600;word-break:keep-all}
.ww-tap-hint{margin:18px 0 0;font-size:13.5px;line-height:1.5;color:var(--muted);word-break:keep-all}
.ww-straf{margin-top:14px;background:#fff;border-radius:10px;padding:16px;border:1.5px solid var(--red);animation:ww-in .25s ease-out both}
.ww-straf-h{margin:0;font-size:15.5px;font-weight:700;color:var(--red);word-break:keep-all}
.ww-straf-sub{margin:4px 0 0;font-size:13.5px;color:var(--muted);line-height:1.5;word-break:keep-all}
.ww-straf-word{margin:14px 0 0;font-family:var(--din);font-weight:700;font-size:28px;line-height:1.15;color:var(--ink);min-height:32px;overflow-wrap:anywhere}
.ww-straf-hidden{color:var(--line);letter-spacing:.12em}
.ww-straf-dots{display:flex;gap:6px;margin:12px 0 12px}
.ww-straf-dots span{width:28px;height:6px;border-radius:3px;background:var(--line-2)}
.ww-straf-dots span.on{background:var(--red)}
.ww-straf-in{font-size:17px}
.ww-straf .ww-duo{align-items:center;margin-top:10px}
.ww-input.is-err{border-color:var(--red);box-shadow:0 0 0 1px var(--red);animation:ww-shake .35s}
.ww-nag-bar{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:70;max-width:27rem;margin:0 auto;background:var(--red);color:#fff;font-weight:700;font-size:15px;line-height:1.45;padding:14px 16px;border-radius:12px;box-shadow:0 12px 30px -10px rgba(120,20,10,.6);word-break:keep-all;cursor:pointer}
.ww-nag-full{position:fixed;inset:0;z-index:80;background:rgba(210,59,47,.94);display:flex;align-items:center;justify-content:center;padding:24px}
.ww-nag-box{width:100%;max-width:24rem;background:#fff;border-radius:14px;padding:22px 20px 20px}
.ww-nag-h{margin:0;font-family:var(--din);font-weight:700;font-size:28px;line-height:1.2;color:var(--red);word-break:keep-all}
.ww-nag-p{margin:10px 0 18px;font-size:15px;line-height:1.6;color:var(--graphite);word-break:keep-all}
.ww-shake{animation:ww-shake .5s cubic-bezier(.36,.07,.19,.97) both}
@keyframes ww-shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.ww-lock-i{color:var(--red);margin-bottom:10px;display:block}
.ww-tab.is-locked{color:var(--line)}
.ww-tab.is-locked[aria-current="page"]{color:var(--muted)}
.ww-done .ww-streak{display:flex;align-items:center;gap:4px;margin:12px 0 4px;font-size:15px;color:var(--graphite)}
.ww-done .ww-streak svg{color:var(--red)}
.ww-done .ww-streak b{font-family:var(--din);font-size:26px;color:var(--red);margin:0 2px 0 2px}
.ww-giveup{margin-top:14px;padding:14px;border:1.5px dashed var(--red);border-radius:10px}
.ww-giveup .ww-panel-p{margin-top:0}
.ww-giveup-s{margin:10px 0 10px;font-family:var(--serif);font-size:19px;font-weight:700;color:var(--ink)}
.ww-giveup .ww-btn{margin-top:10px}
.ww-group-r{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.ww-group-h svg{transition:transform .2s}
.ww-rot{transform:rotate(180deg)}
.ww-plan-fail{flex:none;font-size:12.5px;font-weight:700;color:#fff;background:var(--red);border-radius:999px;padding:3px 10px}
.ww-plan-note{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--muted);word-break:keep-all}
.ww-s-ko{margin:8px 0 0;font-size:17px;line-height:1.55;color:var(--graphite);font-weight:600;word-break:keep-all}
.ww-s-ans{margin-top:16px;min-height:58px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;align-items:center;padding:0 0 12px;border-bottom:1.5px solid var(--ink)}
.ww-s-ans.is-no{border-bottom-color:var(--red)}
.ww-s-ph{font-size:13.5px;color:var(--muted)}
.ww-s-pool{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.ww-tile{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;font-family:var(--serif);font-size:17px;line-height:1.2;color:var(--graphite);box-shadow:0 2px 0 var(--line);cursor:pointer}
.ww-tile:active{transform:translateY(1px);box-shadow:none}
.ww-s-ans .ww-tile{background:rgba(var(--marker),.38);border-color:transparent;box-shadow:none}
.ww-tile.t-ok{background:rgba(var(--marker),.6)}
.ww-tile.t-no{background:#fff;border-color:var(--red);color:var(--red);text-decoration:line-through}
.ww-tile:disabled{opacity:1;cursor:default}
.ww-s-btns{margin-top:16px}
.ww-straf-sent{margin:12px 0 0;font-family:var(--serif);font-size:18px;line-height:1.6;color:var(--ink)}
.ww-straf-ta{min-height:92px;resize:vertical;font-size:17px;line-height:1.5}
.ww-confess{z-index:85}
.ww-mt{margin-top:12px}
.ww-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.4;word-break:break-all;resize:vertical}
.ww-fresh{display:block;width:100%;margin:-4px 0 12px;padding:10px 12px;border:1px dashed var(--ink);border-radius:8px;background:#fff;color:var(--ink);font-size:13px;font-weight:600;text-align:left;line-height:1.5;word-break:keep-all;cursor:pointer}
